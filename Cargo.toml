[package]
name = "mailview"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "A GTK4/libadwaita email client for Linux with IMAP, Gmail and GNOME Online Accounts support"
license = "MIT"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_12"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
webkit6 = "0.4"
glib = "0.20"

zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros"] }
futures-util = "0.3"
async-channel = "2"

imap = "2.4"
imap-proto = "0.10"
native-tls = "0.2"
mail-parser = "0.9"

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = "0.4"
base64 = "0.22"
ammonia = "4"
log = "0.4"
env_logger = "0.11"
dirs = "5"
urlencoding = "2"
oo7 = { version = "0.4", default-features = false, features = ["tokio", "native_crypto"] }
lettre = { version = "0.11.19", default-features = false, features = ["smtp-transport", "native-tls", "builder", "hostname"] }

[profile.release]
opt-level = 2
